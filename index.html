<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Aucxley Solutions is a full-stack technology studio in Nairobi. We build websites, e-commerce platforms, and custom management systems for businesses across East Africa." />
    <meta property="og:title" content="Aucxley Solutions — Technology Studio" />
    <meta property="og:description" content="We build the systems businesses run on — websites, e-commerce with M-Pesa, and custom management systems. Nairobi, Kenya." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#f7fcfa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#25272c" media="(prefers-color-scheme: dark)" />
    <title>Aucxley Solutions</title>
    <link rel="icon" type="image/x-icon" href="/potflio.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function() {
        var theme = localStorage.getItem('theme');
        if (!theme) {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
